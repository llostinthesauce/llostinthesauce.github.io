<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noai, noimageai">
    <title>nuBlog</title>
    <style>
        html { height: 100%; background-color: #000080; }
        body {
            margin: 0;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Geneva, Verdana, sans-serif;
            color: #FFFFFF;
            text-align: center;
        }
        .content {
            background-color: #000000;
            border: 2px solid #5CCCCC;
            width: 85%;
            max-width: 560px;
            margin: 20px 16px;
            padding: 28px 20px;
            box-sizing: border-box;
        }
        h1 { color: #9966CC; font-size: 24px; margin: 0 0 14px; }
        p { margin: 8px 0; line-height: 1.6; }
        .note { color: #99CCCC; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>
    <main class="content">
        <h1>nuBlog</h1>
        <p>under construction ~ check back later :3</p>
        <p class="note">the site is taking a little break while i tidy up</p>
    </main>
</body>
</html>
