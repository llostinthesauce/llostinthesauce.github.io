<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noai, noimageai">
    <title>404 - nuBlog</title>
    <!-- Root-absolute paths: GitHub Pages serves 404.html at any URL depth,
         so relative paths would break for e.g. /blog/missing.html -->
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        .ascii-art {
            font-family: monospace;
            color: #33CCAA;
            font-size: 1.25em;
            line-height: 1.15;
            text-align: center;
            margin: 28px auto;
            white-space: pre;
            max-width: 100%;
            overflow-x: auto;
        }
        /* 90s mac error vibes: the sad face blinks */
        .sad-face {
            animation: sad-blink 1.4s step-end infinite;
        }
        @keyframes sad-blink {
            0%, 60% { opacity: 1; }
            61%, 100% { opacity: 0; }
        }
        .error-code {
            text-align: center;
            font-family: monospace;
            font-size: 2.5em;
            color: #FF6666;
            margin: 0 0 8px;
            text-shadow: 0 0 10px rgba(255, 100, 100, 0.4);
        }
    </style>
</head>

<body>
    <div class="content">
        <div id="site-header"></div>
        <main id="main-content" tabindex="-1">

        <h1 class="error-code">404</h1>

        <div class="ascii-art"> ___________________
|  _______________  |
| |               | |
| |    <span class="sad-face">X     X</span>    | |
| |               | |
| |     <span class="sad-face">_____</span>     | |
| |    <span class="sad-face">/     \</span>    | |
| |_______________| |
|                   |
|   ===========  o  |
|___________________|</div>

        </main>
        <div id="site-footer"></div>
    </div>

    <script src="/js/include.js?v=1aafdebda101" data-base="/"></script>
</body>

</html>
