    <link rel="stylesheet" href="styles/style.css">

    <style>
        .gallery-table img.styled-image {
            max-width: 100%;
            width: auto;
            height: auto;
            border-radius: 0px;
            box-shadow: none;
            border: none;
        }

        .gallery-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .gallery-table td {
            width: 50%;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }

        .gallery-table p {
            margin-top: 5px;
            color: #99CCCC;
            font-family: 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Geneva, Verdana, sans-serif;
            font-size: 0.9em;
        }

        .image-wrapper {
            width: 100%;
            text-align: center;
            overflow: hidden;
        }

        .gallery-entry {
            background-color: #111;
            border: 1px solid #444;
            margin: 18px 0;
            padding: 18px;
            font-family: monospace;
            text-align: center;
        }

        .gallery-entry-label {
            color: #33CCAA;
            text-decoration: none;
            font-size: 1.05em;
            display: block;
        }

        .gallery-entry-label:hover {
            background-color: #222;
        }

        .gallery-entry-label.is-disabled {
            color: #88AFAA;
            text-decoration: none;
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        .gallery-groups {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 12px 0 20px;
        }

        .gallery-group-title {
            margin: 0 0 6px;
        }

        .gallery-group-note {
            margin: 0 0 12px;
            color: #99CCCC;
            font-size: 0.9em;
        }

        .gallery-grid {
            --gallery-min-width: 220px;
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(var(--gallery-min-width), 1fr));
        }

        .gallery-grid .gallery-entry {
            margin: 0;
        }

        .gallery-entry-children {
            --gallery-child-min-width: 140px;
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(var(--gallery-child-min-width), 1fr));
            margin-top: 12px;
        }

        .gallery-entry-children:empty {
            display: none;
        }

        .gallery-entry-children .gallery-entry {
            padding: 12px;
        }

        .gallery-entry-children .gallery-entry-label {
            font-size: 0.95em;
        }

        .gallery-entry-year .gallery-entry-label {
            font-size: 1.2em;
        }

        .gallery-entry-preview {
            position: relative;
            width: 100%;
            background-color: #111;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 2em;
            text-align: center;
            color: #33CCAA;
            text-decoration: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            padding: 0;
        }

        .gallery-entry-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            transition: background 0.3s ease;
        }

        .gallery-entry-preview:hover::before {
            background: rgba(0, 0, 0, 0.4);
        }

        .gallery-entry-preview:hover {
            transform: scale(1.02);
        }

        .gallery-entry-preview .gallery-entry-label {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            font-size: 1em;
            letter-spacing: 0.5px;
        }
    </style>
</head>
