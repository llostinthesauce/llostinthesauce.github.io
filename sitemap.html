<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noai, noimageai">
<title>sitemap - nuBlog</title>
<style>
body {
    font-family: monospace;
    background-color: #fff;
    color: #000;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.4;
}
h1 {
    border-bottom: 2px solid #000;
    padding-bottom: 8px;
    font-size: 1.4em;
}
summary {
    cursor: pointer;
    user-select: none;
    font-weight: bold;
    padding: 4px 0;
}
summary::before {
    content: "[+] ";
    display: inline-block;
    width: 30px;
}
details[open] > summary::before {
    content: "[-] ";
}
details {
    margin: 4px 0;
}
a {
    color: #000;
    text-decoration: underline;
}
a:hover {
    background-color: #000;
    color: #fff;
}
.tree-container {
    margin-top: 20px;
    font-size: 0.95em;
}
.folder {
    margin-left: 24px;
}
.file {
    margin-left: 28px;
}
.count {
    color: #555;
    font-size: 0.8em;
    margin-left: 8px;
}
.nav {
    margin-bottom: 20px;
    border-bottom: 1px solid #000;
    padding-bottom: 10px;
}
.nav a {
    margin-right: 15px;
    text-decoration: none;
}
.nav a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
<div class="nav">
  <a href="index.html">home</a>
  <a href="galleries.html">photos</a>
  <a href="blog.html">blog</a>
  <a href="blog/builds/index.html">builds+</a>
  <a href="plants.html">plants</a>
  <a href="about.html">about</a>
</div>

<h1>sitemap / directory tree</h1>
<p>Click [+] to expand folders. All HTML files are clickable.</p>
<div class="tree-container" id="tree"></div>

<script src="js/sitemap-data.js"></script>
<script>
(function() {
    var data = window.__SITEMAP__;
    if (!data) {
        document.getElementById('tree').textContent = 'sitemap data not found — run: python3 build-sitemap.py';
        return;
    }

    function createFolder(name, folderData, prefix) {
        var details = document.createElement('details');
        if (!prefix) details.open = true;

        var summary = document.createElement('summary');
        summary.textContent = name + '/';

        var fileCount = 0;
        if (folderData.files) fileCount += folderData.files.length;
        Object.keys(folderData.folders || {}).forEach(function(k) {
            var f = folderData.folders[k];
            if (f.files) fileCount += f.files.length;
        });
        if (fileCount > 0) {
            var countSpan = document.createElement('span');
            countSpan.className = 'count';
            countSpan.textContent = fileCount + ' items';
            summary.appendChild(countSpan);
        }

        details.appendChild(summary);

        var content = document.createElement('div');
        content.className = 'folder';

        if (folderData.files && folderData.files.length > 0) {
            folderData.files.forEach(function(fileName) {
                var fileDiv = document.createElement('div');
                fileDiv.className = 'file';

                if (fileName.endsWith('.html') && !fileName.startsWith('(')) {
                    var link = document.createElement('a');
                    link.href = prefix ? prefix + '/' + fileName : fileName;
                    link.textContent = fileName;
                    fileDiv.appendChild(link);
                } else if (fileName.endsWith('/')) {
                    fileDiv.textContent = fileName;
                } else {
                    fileDiv.textContent = fileName;
                }
                content.appendChild(fileDiv);
            });
        }

        if (folderData.note) {
            var noteDiv = document.createElement('div');
            noteDiv.style.fontSize = '0.8em';
            noteDiv.style.color = '#555';
            noteDiv.style.marginLeft = '28px';
            noteDiv.textContent = folderData.note;
            content.appendChild(noteDiv);
        }

        if (folderData.folders) {
            Object.keys(folderData.folders).sort().forEach(function(subName) {
                var subPrefix = prefix ? prefix + '/' + subName : subName;
                var subFolder = createFolder(subName, folderData.folders[subName], subPrefix);
                content.appendChild(subFolder);
            });
        }

        details.appendChild(content);
        return details;
    }

    var treeContainer = document.getElementById('tree');
    var rootFolder = createFolder('.', data, '');
    treeContainer.appendChild(rootFolder);

    console.log('%c sitemap tree rebuilt from current directory structure', 'color:#000;font-family:monospace');
})();
</script>
</body>
</html>
