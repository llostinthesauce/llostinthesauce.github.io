<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noai, noimageai">
    <title>image gallery - nuBlog</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="content">
        <div id="site-header"></div>

        <h1>image gallery</h1>
        <div class="blog-post-date">last updated 5/16/2026</div>

        <div class="gallery-groups" data-gallery-groups></div>

        <template id="gallery-group-template">
            <section class="gallery-group">
                <h2 class="gallery-group-title"></h2>
                <p class="gallery-group-note"></p>
                <div class="gallery-grid"></div>
            </section>
        </template>

        <template id="gallery-entry-template">
            <div class="gallery-entry">
                <a href="#" class="gallery-entry-label"></a>
                <div class="gallery-entry-children"></div>
            </div>
        </template>

        <div id="site-footer"></div>
    </div>

    <script src="js/include.js" data-base="."></script>
    <script src="js/gallery-data.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
