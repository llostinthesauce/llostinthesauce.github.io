    <script>
        function loadMoreImages(batchNumber) {
            // Show the batch
            const batchRows = document.querySelectorAll('.batch-' + batchNumber);
            batchRows.forEach(row => {
                row.classList.remove('hidden-batch');
            });

            // Hide the button that was clicked
            const buttons = document.querySelectorAll('[onclick="loadMoreImages(' + batchNumber + ')"]');
            buttons.forEach(btn => btn.style.display = 'none');

            // Show the next button if it exists
            const nextButton = document.querySelector('.batch-' + batchNumber + '-btn');
            if (nextButton) {
                nextButton.style.display = 'block';
            }
        }
    </script>
