<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vivitar pz3090 film camera gallery - nuBlog</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <style>
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
            padding: 0 10px;
        }

        .big-link-box {
            position: relative;
            flex: 1 1 300px;
            max-width: 500px;
            background-color: #111;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 2em;
            text-align: center;
            color: #33CCAA;
            text-decoration: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .big-link-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            transition: background 0.3s ease;
        }

        .big-link-box:hover::before {
            background: rgba(0, 0, 0, 0.4);
        }

        .big-link-box:hover {
            transform: scale(1.02);
        }

        .big-link-box span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .big-link-box {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div id="site-header"></div>
        <div style="margin: 10px 0;">
            <a href="javascript:history.back()" style="color: #9966CC; font-style: italic; text-decoration: underline; font-family: monospace; font-size: 0.9em; font-weight: bold;">
                &larr; back to galleries
            </a>
        </div>

        <h1>vivitar root directory</h1>

        <p>click a box below to view the full gallery</p>

        <div class="row">
            <a href="vivitar-san-diego.html"
               class="big-link-box"
               style="background-image: url('../../images/cameras/vivitar/film/vivitar30.JPG');">
                <span>san diego, 2024</span>
            </a>
            <a href="vivitar-utah.html"
               class="big-link-box"
               style="background-image: url('../../images/cameras/vivitar/film/vivitar17.JPG');">
                <span>utah, 2024</span>
            </a>
        </div>

        <div id="site-footer"></div>
    </div>
    <script src="../../_tools/include.js" data-base="../.."></script>
</body>
</html>
