<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>canon powershot sd400 digital camera - nuBlog</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <style>
        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 40px;
            justify-content: center;
            padding: 0 10px;
        }

        .big-link-box {
            position: relative;
            width: 100%;
            background-color: #111;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 2em;
            text-align: center;
            color: #33CCAA;
            text-decoration: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .big-link-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            transition: background 0.3s ease;
        }

        .big-link-box:hover::before {
            background: rgba(0, 0, 0, 0.4);
        }

        .big-link-box:hover {
            transform: scale(1.02);
        }

        .big-link-box span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="content">

            </a>
