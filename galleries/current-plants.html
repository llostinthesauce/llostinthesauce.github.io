<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>current plants - nuBlog</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <style>
        .gallery-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .gallery-table td {
            width: 50%;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }
        .gallery-table img.styled-image {
            max-width: 100%;
            height: auto;
            border: none;
        }
        .gallery-table p {
            margin-top: 5px;
            color: #99CCCC;
            font-size: 0.9em;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0 30px;
            justify-content: center;
            padding: 0 10px;
        }
        .big-link-box {
            position: relative;
            flex: 1 1 300px;
            max-width: 500px;
            background-color: #111;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 2em;
            text-align: center;
            color: #33CCAA;
            text-decoration: none;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            aspect-ratio: 3 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .big-link-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            transition: background 0.3s ease;
        }
        .big-link-box:hover::before {
            background: rgba(0, 0, 0, 0.4);
        }
        .big-link-box:hover {
            transform: scale(1.02);
        }
        .big-link-box span {
            position: relative;
            z-index: 1;
        }
        @media (max-width: 768px) {
            .big-link-box {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="content">

        </div>

            </tr>
